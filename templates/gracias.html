<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>¡Gracias por tu respuesta!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

    /* ====== VIDEO BACKGROUND ====== */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }

    /* Técnica: iframe grande para cubrir 16:9 en cualquier pantalla */
    .video-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120vw;
      height: 120vh;
      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none; /* evita clics sobre el video */
    }

    /* Overlay para mejorar contraste */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      /*background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.10), transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(0,0,0,0.45), transparent 55%),
                  linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.60));*/
    }

    /* ====== MODAL ====== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
    }

    .modal {
      width: min(720px, 92vw);
      border-radius: 22px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
      padding: 34px 30px;
      color: #fff;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .modal::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.18), transparent 45%),
                  radial-gradient(circle at 70% 80%, rgba(19,165,56,0.20), transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    .modal-content {
      position: relative;
      z-index: 1;
    }

    .modal h1 {
      font-size: clamp(2rem, 3.2vw, 3rem);
      line-height: 1.05;
      margin-bottom: 10px;
      text-shadow: 0 3px 12px rgba(0,0,0,0.45);
    }

    .modal p {
      font-size: 1.05rem;
      opacity: 0.95;
      line-height: 1.55;
      text-shadow: 0 2px 8px rgba(0,0,0,0.40);
    }

    .brand-tag {
      margin-top: 14px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.82rem;
      opacity: 0.92;
    }

    .logo-wrap {
      margin-top: 18px;
      display: flex;
      justify-content: center;
    }

    .logo-wrap img {
      width: min(220px, 62vw);
      height: auto;
      opacity: 0.98;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.35));
    }

    /* Animación de entrada */
    .modal-backdrop.show { display: flex; }
    .modal {
      transform: translateY(18px) scale(0.985);
      opacity: 0;
      animation: modalIn 520ms ease-out forwards;
    }

    @keyframes modalIn {
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    /* Botón opcional para cerrar (lo podés sacar si no querés cierre) */
    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.20);
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      line-height: 42px;
    }
    .close-btn:hover { background: rgba(0,0,0,0.35); }

    /* Mobile: ajusta iframe para evitar recortes raros */
    @media (max-width: 680px) {
      .video-bg iframe {
        width: 220vw;
        height: 220vh;
      }
      .modal { padding: 28px 22px; }
    }
  </style>
</head>

<body>

  <!-- VIDEO BACKGROUND -->
  <div class="video-bg">
    <!-- Cambiá VIDEO_ID por el id del video que quieras -->
    <div id="yt-player"></div>
  </div>

  <!-- Overlay -->
  <div class="overlay"></div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="thankModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="title">
      <button class="close-btn" id="closeModal" aria-label="Cerrar">✕</button>

      <div class="modal-content">
        <h1 id="title">¡Gracias por responder nuestra encuesta!</h1>
        <!--<p>Te deseamos un <strong>excelente comienzo de año</strong>.</p>-->

        <p class="brand-tag">
          Equipo de Sistemas - <span>Nobis Medical</span>
        </p>

        <!-- ✅ Logo de Operaciones dentro del modal -->
        <div class="logo-wrap">
          <img src="{{ url_for('static', filename='logo_operaciones.png') }}" alt="Operaciones - Nobis Medical">
        </div>
      </div>
    </div>
  </div>

  <!-- YouTube IFrame API -->
  <script>
    // ===== CONFIG =====
    const VIDEO_ID = "_mzCKSJwlY4";
    const SHOW_MODAL_AFTER_SECONDS = 4.5;

    // ===== MODAL =====
    const modal = document.getElementById("thankModal");
    const closeBtn = document.getElementById("closeModal");

    function openModal() {
      modal.classList.add("show");
    }
    function closeModal() {
      modal.classList.remove("show");
      modal.style.display = "none"; // por si querés que no vuelva a mostrarse
    }
    closeBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    // ===== YOUTUBE API LOAD =====
    let player;
    let modalShown = false;
    let modalTimer = null;

    function loadYouTubeAPI() {
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("yt-player", {
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          mute: 1,
          loop: 0,
          iv_load_policy: 3
        },
        events: {
          onReady: (event) => {
            // Arranca mute + play
            try {
              event.target.mute();
              event.target.playVideo();
            } catch (e) {}
          },
          onStateChange: (event) => {
            // Cuando el video realmente empieza (PLAYING), arrancamos el timer de 3s
            if (event.data === YT.PlayerState.PLAYING && !modalShown) {
              modalShown = true;

              if (modalTimer) clearTimeout(modalTimer);
              modalTimer = setTimeout(() => {
                openModal();
              }, SHOW_MODAL_AFTER_SECONDS * 1000);
            }

            // Si el video termina, lo pausamos (o podrías reiniciarlo si querés)
            if (event.data === YT.PlayerState.ENDED) {
              try { event.target.stopVideo(); } catch (e) {}
            }
          }
        }
      });
    };

    // Fallback: por si autoplay es bloqueado hasta interacción
    document.addEventListener("click", () => {
      if (!player) return;
      try {
        player.mute();
        player.playVideo();
      } catch (e) {}
    }, { once: true });

    loadYouTubeAPI();
  </script>

</body>
</html>
